<!doctype html>
<html lang="en">
  <head>

      as="style"

      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,700;1,400&display=swap"
